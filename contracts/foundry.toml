[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536
seed = "0x534554544c45434f5245"

[profile.ci.fuzz]
runs = 10000

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = true
call_override = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"

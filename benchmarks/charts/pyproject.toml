[project]
name = "settlecore-benchmark-charts"
version = "0.1.0"
description = "Deterministic SVG chart generator for SettleCore C++17 CLOB Google Benchmark JSON and HdrHistogram CSV dumps"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9.2",
    "numpy>=2.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
